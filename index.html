<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08111d">
  <title>JARVIS</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <div>
        <div class="brand">JARVIS</div>
        <div id="status">SYSTEM ONLINE</div>
      </div>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings">⚙</button>
    </header>

    <main id="mainView">
      <section class="orb-section">
        <div class="orb" id="orb">
          <div class="orb-core"></div>
        </div>
        <p id="jarvisMessage">Good evening, Dev. Systems are ready.</p>
      </section>

      <section class="quick-actions">
        <button data-action="brief">☀️ Brief me</button>
        <button data-action="task">✓ Add task</button>
        <button data-action="project">◈ Projects</button>
      </section>

      <section class="panel">
        <div class="panel-title">CONVERSATION</div>
        <div id="conversation" class="conversation"></div>
      </section>

      <section class="input-area">
        <input id="commandInput" placeholder="Give JARVIS a command..." autocomplete="off">
        <button id="wakeBtn" class="wake-button" type="button">⚡ Wake</button>
      <button id="voiceBtn" class="voice">🎙</button>
        <button id="sendBtn" class="send">➤</button>
      </section>
    </main>

    <nav>
      <button class="nav active" data-view="home">⌂<span>Home</span></button>
      <button class="nav" data-view="tasks">✓<span>Tasks</span></button>
      <button class="nav" data-view="projects">◈<span>Projects</span></button>
      <button class="nav" data-view="memory">◉<span>Memory</span></button>
    </nav>
  </div>

  <div class="modal hidden" id="modal">
    <div class="modal-card" id="modalCard"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
